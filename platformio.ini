; PlatformIO Project Configuration
; M5Stack Core (M5GO) + Module LoRa 868MHz (SX1276)

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino

; Port série du M5Stack (détecté automatiquement si commenté, ou fixe)
;upload_port = /dev/tty.usbserial-0213F99E
;monitor_port = /dev/tty.usbserial-0213F99E
monitor_speed = 115200
;upload_speed = 115200

; Librairies nécessaires
; Note: M5Stack inclut déjà une lib LoRa (M5LoRa), pas besoin de sandeepmistry/LoRa
lib_deps =
    m5stack/M5Stack @ ^0.4.6
    bblanchon/ArduinoJson @ ^7.0.0

; Options de build
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
